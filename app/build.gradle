plugins {
    id "com.android.application"
    id "kotlin-android"
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.termux.lite"
    compileSdk = 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId = "com.termux"
        minSdk = 24
        // Keep 28 so /data/data/com.termux/files/usr stays executable and
        // WRITE_EXTERNAL_STORAGE still covers /sdcard.
        targetSdk = 28
        // Above Termux 0.118.0 (1020) and TermuxLite 1.1.0 (1021).
        versionCode = 1025
        versionName = "1.2.3"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Official Termux community debug key (testkey_untrusted.jks)
        // Cert SHA-256: b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs += [
            "-Xbackend-threads=4",
            "-Xno-param-assertions",
            "-Xno-call-assertions",
            "-opt-in=kotlin.RequiresOptIn"
        ]
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        disable 'ProtectedPermissions', 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/*.version',
                '/META-INF/*.kotlin_module',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.activity:activity-compose:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    def composeBom = platform("androidx.compose:compose-bom:2024.06.00")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Official Termux terminal emulator + view from JitPack
    implementation "com.github.termux.termux-app:terminal-view:v0.118.3"

    testImplementation "junit:junit:4.13.2"
}
