plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

android {
    namespace = "com.termux.lite"
    compileSdk = 37
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId = "com.termux"
        minSdk = 28
        // Keep 28 so /data/data/com.termux/files/usr stays executable and
        // WRITE_EXTERNAL_STORAGE still covers /sdcard.
        targetSdk = 28
        // Above Termux 0.118.0 (1020) and TermuxLite 1.1.0 (1021).
        versionCode = 1034
        versionName = "1.3.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // Official Termux community debug key (testkey_untrusted.jks)
        // Cert SHA-256: b6da01480eefd5fbf2cd3771b8d1021ec791304bdd6c4bf41d3faabad48ee5e1
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        disable 'ProtectedPermissions', 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/*.version',
                '/META-INF/*.kotlin_module',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*'
            ]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll([
            "-Xbackend-threads=4",
            "-Xno-param-assertions",
            "-Xno-call-assertions"
        ])
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    def composeBom = platform("androidx.compose:compose-bom:2026.08.00")
    implementation composeBom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"

    implementation "androidx.annotation:annotation:1.9.1"

    testImplementation "junit:junit:4.13.2"
}
