[package]
name = "termuxlite_native"
version = "1.2.6"
edition = "2024"
rust-version = "1.85"
authors = ["Termux"]
description = "High-performance Rust native engine for TermuxLite"

[lib]
name = "termuxlite_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
