[package]
name = "termuxlite_native"
version = "1.2.5"
edition = "2021"
authors = ["Termux"]
description = "High-performance Rust native engine for TermuxLite"

[lib]
name = "termuxlite_native"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
