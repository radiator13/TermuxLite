name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      - name: Unit tests
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx13g -XX:+UseParallelGC -XX:ParallelGCThreads=4"
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: Build APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx13g -XX:+UseParallelGC -XX:ParallelGCThreads=4"
            -Dorg.gradle.parallel=true
            -Dorg.gradle.caching=true
        run: |
          ./gradlew assembleDebug assembleRelease

      - name: Verify Termux debug signature
        run: |
          python3 scripts/verify-signature.py \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk

      - name: Track SLOC & Generate Reports
        run: |
          mkdir -p dist
          python3 scripts/track-sloc.py --json dist/sloc.json --markdown dist/SLOC.md --update-readme
          cat dist/SLOC.md

      - name: SHA-256 sums
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          cp app/build/outputs/apk/release/*.apk dist/
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then cp "$mapping" dist/mapping-release.txt; fi
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: termux-lite-debug-arm64
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: termux-lite-release-arm64
          path: app/build/outputs/apk/release/*.apk

      - name: Upload checksums & SLOC report
        uses: actions/upload-artifact@v5
        with:
          name: termux-lite-checksums-and-sloc
          path: |
            dist/SHA256SUMS
            dist/SLOC.md
            dist/sloc.json

      - name: Upload R8 mapping
        if: hashFiles('app/build/outputs/mapping/release/mapping.txt') != ''
        uses: actions/upload-artifact@v5
        with:
          name: termux-lite-mapping-release
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            dist/SHA256SUMS
            dist/SLOC.md
            dist/sloc.json
          generate_release_notes: true
